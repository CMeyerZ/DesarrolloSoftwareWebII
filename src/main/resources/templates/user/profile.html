<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container my-4 flex-fill">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Perfil de usuario</h4>
                    <p class="text-muted">Información de la cuenta</p>

                    <div class="mb-3">
                        <label class="form-label"><strong>Nombre</strong></label>
                        <div th:text="${user != null ? user.nombre : '-'}">-</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><strong>Apellido</strong></label>
                        <div th:text="${user != null ? user.apellido : '-'}">-</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"><strong>Correo</strong></label>
                        <div th:text="${user != null ? user.email : '-'}">-</div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <a class="btn btn-primary me-2" th:href="@{/users/change-password}">Cambiar contraseña</a>
                        <a class="btn btn-outline-secondary" th:href="@{/index}">Volver</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
