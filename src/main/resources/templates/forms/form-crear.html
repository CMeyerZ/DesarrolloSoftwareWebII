<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar libro - BookTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="container">
        <div class="card card-form">
            <div class="card-body">
                <h4 class="card-title mb-3">Agregar nuevo libro</h4>
                <p class="text-muted small mb-4">Completa los datos principales para añadir el libro a tu biblioteca.
                </p>

                <form th:action="@{/libros/crear}" method="post" id="bookForm" novalidate>
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="title" class="form-label required">Título</label>
                            <input id="title" name="titulo" type="text" class="form-control" placeholder="El Principito"
                                required>
                        </div>
                        <div class="col-md-4">
                            <label for="author" class="form-label required">Autor</label>
                            <input id="author" name="autor" type="text" class="form-control"
                                placeholder="Antoine de Saint-Exupéry" required>
                        </div>

                        <div class="col-md-2">
                            <label for="rating" class="form-label">Calificación</label>
                            <select id="rating" name="rating" class="form-select" aria-label="Calificación">
                                <option value="">Selecciona</option>
                                <option value="1">1 ★</option>
                                <option value="2">2 ★★</option>
                                <option value="3">3 ★★★</option>
                                <option value="4">4 ★★★★</option>
                                <option value="5">5 ★★★★★</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="category" class="form-label required">Categoría</label>
                            <input id="category" name="categoria" type="text" class="form-control"
                                placeholder="Fantasía, Desarrollo personal, etc." required>
                        </div>

                        <div class="col-md-2">
                            <label for="pages" class="form-label">Páginas</label>
                            <input id="pages" name="paginas" type="number" min="1" class="form-control" placeholder="320">
                        </div>
                        <div class="col-md-4">
                            <label for="isbn" class="form-label required">ISBN</label>
                            <input id="isbn" name="isbn" type="text" class="form-control" placeholder="9783161484100">
                        </div>
                        <div class="col-md-3">
                            <label for="status" class="form-label">Estado</label>
                            <select id="status" name="estado" class="form-select">
                                <option value="por-leer">Por leer</option>
                                <option value="leyendo">Leyendo</option>
                                <option value="leido">Leído</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="startDate" class="form-label">Fecha inicio lectura</label>
                            <input id="startDate" name="fechaInicio" type="date" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label for="endDate" class="form-label">Fecha término lectura</label>
                            <input id="endDate" name="fechaFin" type="date" class="form-control">
                        </div>
                        <div class="col-12">
                            <label for="review" class="form-label">Reseña personal</label>
                            <textarea id="review" name="resena" class="form-control" rows="4"
                                placeholder="Tu opinión sobre el libro, lo que más te gustó..."></textarea>
                        </div>
                        <!-- El propietario se asigna automáticamente desde la sesión del usuario -->
                        <div class="col-12 d-flex justify-content-end">
                            <a href="/index" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar libro</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Normalizar ISBN: quitar guiones, espacios y caracteres no alfanuméricos, convertir a mayúsculas
        function normalizeIsbnStr(s) {
            if (!s) return '';
            return s.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        }

        // Validación mínima antes de enviar
        const form = document.getElementById('bookForm');
        const isbnInput = document.getElementById('isbn');

        if (isbnInput) {
            isbnInput.addEventListener('blur', () => {
                isbnInput.value = normalizeIsbnStr(isbnInput.value);
            });
        }

        form.addEventListener('submit', (e) => {
            // Normalizar el ISBN antes de validar/enviar
            if (isbnInput) isbnInput.value = normalizeIsbnStr(isbnInput.value).trim();

            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const category = document.getElementById('category').value.trim();
            const isbn = isbnInput ? isbnInput.value.trim() : '';
            if (!title || !author || !category || !isbn) {
                e.preventDefault();
                alert('Por favor completa los campos obligatorios: título, autor, categoría e ISBN.');
                return false;
            }
            // validar longitud 13 dígitos en cliente
            if (isbn.length !== 13) {
                e.preventDefault();
                alert('El ISBN debe tener exactamente 13 caracteres numéricos después de normalizar (sin guiones ni espacios).');
                isbnInput.focus();
                return false;
            }
            return true;
        });

        // Habilitar/deshabilitar campos de fecha según estado
        function toggleDateFieldsForCreate(status) {
            const sd = document.getElementById('startDate');
            const ed = document.getElementById('endDate');
            if (!sd || !ed) return;
            if (status === 'leyendo' || status === 'leido') {
                sd.removeAttribute('disabled');
                ed.removeAttribute('disabled');
            } else {
                sd.value = '';
                ed.value = '';
                sd.setAttribute('disabled', 'true');
                ed.setAttribute('disabled', 'true');
            }
        }

        const statusSelect = document.getElementById('status');
        if (statusSelect) {
            // Inicializar según valor actual
            toggleDateFieldsForCreate(statusSelect.value);
            statusSelect.addEventListener('change', (e) => toggleDateFieldsForCreate(e.target.value));
        }
    </script>
</body>

</html>
