<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar libro - BookTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-form { max-width: 900px; margin: 36px auto; border-radius: 10px; box-shadow: 0 6px 20px rgba(13,17,23,0.06); }
        .cover-preview { width: 100%; max-height: 320px; object-fit: cover; border-radius: 6px; }
        .required::after { content: " *"; color: #d00; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-book-reader me-2"></i>
            BookTrack
        </a>
    </div>
</nav>

<main class="container">
    <div class="card card-form">
        <div class="card-body">
            <h4 class="card-title mb-3">Editar libro</h4>
            <p class="text-muted small mb-4">Completa los datos principales para editar el libro en tu biblioteca.</p>

            <form th:action="@{/libros/editar}" method="post" enctype="multipart/form-data" id="bookForm" novalidate>
                <!-- Campo oculto para el ID -->
                <input type="hidden" name="id" th:value="${book.id}">
                
                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="title" class="form-label required">Título</label>
                        <input id="title" name="title" type="text" class="form-control" 
                               placeholder="El Principito" required th:value="${book.title}">
                    </div>
                    <div class="col-md-4">
                        <label for="author" class="form-label required">Autor</label>
                        <input id="author" name="author" type="text" class="form-control" 
                               placeholder="Antoine de Saint-Exupéry" required th:value="${book.author}">
                    </div>

                    <div class="col-md-4">
                        <label for="rating" class="form-label">Calificación</label>
                        <select id="rating" name="rating" class="form-select" aria-label="Calificación" th:value="${book.rating}">
                            <option value="">-- Selecciona --</option>
                            <option value="1" th:selected="${book.rating == 1}">1 ★</option>
                            <option value="2" th:selected="${book.rating == 2}">2 ★★</option>
                            <option value="3" th:selected="${book.rating == 3}">3 ★★★</option>
                            <option value="4" th:selected="${book.rating == 4}">4 ★★★★</option>
                            <option value="5" th:selected="${book.rating == 5}">5 ★★★★★</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="category" class="form-label required">Categoría</label>
                        <input id="category" name="category" type="text" class="form-control" 
                               placeholder="Fantasía, Desarrollo personal, etc." required th:value="${book.category}">
                    </div>

                    <div class="col-md-4">
                        <label for="pages" class="form-label">Páginas</label>
                        <input id="pages" name="pages" type="number" min="1" class="form-control" 
                               placeholder="320" th:value="${book.pages}">
                    </div>

                    <div class="col-12">
                        <label for="review" class="form-label">Reseña personal</label>
                        <textarea id="review" name="review" class="form-control" rows="4" 
                                  placeholder="Tu opinión sobre el libro, lo que más te gustó..." 
                                  th:text="${book.review}"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label for="startDate" class="form-label">Fecha inicio lectura</label>
                        <input id="startDate" name="startDate" type="date" class="form-control"
                               th:value="${#temporals.format(book.startDate, 'yyyy-MM-dd')}">
                    </div>

                    <div class="col-md-6">
                        <label for="endDate" class="form-label">Fecha término lectura (opcional)</label>
                        <input id="endDate" name="endDate" type="date" class="form-control"
                               th:value="${#temporals.format(book.endDate, 'yyyy-MM-dd')}">
                    </div>

                    <div class="col-md-6">
                        <label for="status" class="form-label">Estado</label>
                        <select id="status" name="status" class="form-select">
                            <option value="por-leer" th:selected="${book.status == 'por-leer'}">Por leer</option>
                            <option value="leyendo" th:selected="${book.status == 'leyendo'}">Leyendo</option>
                            <option value="leido" th:selected="${book.status == 'leido'}">Leído</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="cover" class="form-label">Portada (opcional)</label>
                        <input id="cover" name="cover" type="file" accept="image/*" class="form-control">
                    </div>

                    <div class="col-md-6 d-flex flex-column align-items-start">
                        <label class="form-label">Vista previa</label>
                        <img id="coverPreview" 
                             th:src="${book.coverUrl != null ? book.coverUrl : 'https://via.placeholder.com/300x420?text=Portada'}" 
                             alt="Vista previa de portada" 
                             class="cover-preview">
                    </div>

                    <div class="col-12 d-flex justify-content-end">
                        <a href="/" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar libro</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="text-center mt-4 mb-4 small text-muted">&copy; <span th:text="${T(java.time.Year).now().value}">2025</span> BookTrack</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Preview de imagen seleccionada
    const coverInput = document.getElementById('cover');
    const preview = document.getElementById('coverPreview');
    if (coverInput) {
        coverInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) { preview.src = 'https://via.placeholder.com/300x420?text=Portada'; return; }
            const url = URL.createObjectURL(file);
            preview.src = url;
        });
    }

    // Validación mínima antes de enviar
    const form = document.getElementById('bookForm');
    form.addEventListener('submit', (e) => {
        const title = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const category = document.getElementById('category').value.trim();
        if (!title || !author || !category) {
            e.preventDefault();
            alert('Por favor completa los campos obligatorios: título, autor y categoría.');
            return false;
        }
        return true;
    });

    // Habilitar/deshabilitar campos de fecha según estado
    function toggleDateFieldsForCreate(status) {
        const sd = document.getElementById('startDate');
        const ed = document.getElementById('endDate');
        if (!sd || !ed) return;
        if (status === 'leyendo' || status === 'leido') {
            sd.removeAttribute('disabled');
            ed.removeAttribute('disabled');
        } else {
            sd.value = '';
            ed.value = '';
            sd.setAttribute('disabled', 'true');
            ed.setAttribute('disabled', 'true');
        }
    }

    const statusSelect = document.getElementById('status');
    if (statusSelect) {
        // Inicializar según valor actual
        toggleDateFieldsForCreate(statusSelect.value);
        statusSelect.addEventListener('change', (e) => toggleDateFieldsForCreate(e.target.value));
    }
</script>
</body>
</html>
